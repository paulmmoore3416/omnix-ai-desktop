[package]
name = "omnix"
version = "1.0.0"
description = "OMNIX - local-first AI desktop assistant"
authors = ["Paul Moore <paulmmoore3416@gmail.com>"]
edition = "2021"
# Effective minimum: sysinfo 0.39 requires 1.95.
rust-version = "1.95"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omnix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# The dialog plugin is driven from Rust only (native confirmations, file pickers).
# No JS plugin permissions are granted to the webview for it.
tauri-plugin-dialog = "2"
# Launch-at-login, driven from Rust by `general.auto_start` (no JS permissions granted).
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
# App log file (separate from the audit log); `tracing` events reach it via the `log` bridge.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "query", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39"
dirs = "7"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
keyring = "4"
shlex = "2"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
url = "2"
async-trait = "0.1"
futures-util = "0.3"
# MCP client only (no server, no macros): stdio + streamable HTTP transports.
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same version wry uses; needed to enable WebKitGTK media streams and answer
# microphone permission requests (wry does neither).
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(unix)'.dependencies]
# Used only for `killpg` so a timed-out command's whole process group is terminated.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
# AIORC gRPC routing backend. Scaffold only: the AIORC .proto is not in this
# repository, so the provider returns NotImplemented. Off by default.
aiorc = []
