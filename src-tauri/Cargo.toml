[package]
name = "omnix"
version = "1.0.0"
description = "OMNIX - local-first AI desktop assistant"
authors = ["Paul Moore <paulmmoore3416@gmail.com>"]
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omnix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The dialog plugin is driven from Rust only (native confirmations, file pickers).
# No JS plugin permissions are granted to the webview for it.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
dirs = "5.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
keyring = "4"
shlex = "2"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
# Used only for `killpg` so a timed-out command's whole process group is terminated.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
